# Home-status machine decision matrix (domain.daylight.home_status).
# Each entry: full inputs (defaults merged from the top-level `defaults`) ->
# expected status + attributes. The fixture is the *policy contract* that the
# deployed adapter must satisfy; adapters map HA entities onto these inputs.
# Entity IDs never live here. `now` is local wall time.
#
# Weekday axes (owner-verified #027):
#   wake:    Mon-Fri -> wake_weekday, Sat-Sun -> wake_weekend
#   bedtime: Sun-Thu -> bedtime_weekday, Fri-Sat -> bedtime_weekend
# Boundaries are inclusive: exactly at wake => awake; exactly at bed => sleep.
defaults:
  schedule:
    wake_weekday: "06:45:00"
    wake_weekend: "08:00:00"
    bedtime_weekday: "21:00:00"
    bedtime_weekend: "21:30:00"
cases:
  - name: weekday_morning_awake
    inputs: {family_home: true, now: "2026-10-26 08:00:00"}  # Mon 08:00
    expect: {status: awake, is_workday: true, next_wake: "2026-10-27 06:45:00", next_bedtime: "2026-10-26 21:00:00"}

  - name: weekday_night_sleep
    inputs: {family_home: true, now: "2026-10-26 22:00:00"}  # Mon 22:00
    expect: {status: sleep, is_workday: true, next_wake: "2026-10-27 06:45:00", next_bedtime: "2026-10-27 21:00:00"}

  - name: saturday_morning_weekend_wake
    inputs: {family_home: true, now: "2026-10-24 08:30:00"}  # Sat 08:30
    expect: {status: awake, is_workday: false, next_wake: "2026-10-25 08:00:00", next_bedtime: "2026-10-24 21:30:00"}

  - name: saturday_night_weekend_bedtime
    inputs: {family_home: true, now: "2026-10-24 21:15:00"}  # Sat 21:15 < 21:30
    expect: {status: awake, is_workday: false, next_wake: "2026-10-25 08:00:00", next_bedtime: "2026-10-24 21:30:00"}

  - name: saturday_late_night_sleep
    inputs: {family_home: true, now: "2026-10-24 23:00:00"}  # Sat 23:00
    expect: {status: sleep, is_workday: false, next_wake: "2026-10-25 08:00:00", next_bedtime: "2026-10-25 21:00:00"}

  - name: sunday_morning_weekend_wake_not_yet
    inputs: {family_home: true, now: "2026-10-25 07:30:00"}  # Sun 07:30 < weekend wake
    expect: {status: sleep, is_workday: false, next_wake: "2026-10-25 08:00:00", next_bedtime: "2026-10-25 21:00:00"}

  - name: sunday_morning_weekend_wake_passed
    inputs: {family_home: true, now: "2026-10-25 09:00:00"}  # Sun 09:00 > weekend wake
    expect: {status: awake, is_workday: false, next_wake: "2026-10-26 06:45:00", next_bedtime: "2026-10-25 21:00:00"}

  - name: sunday_evening_weekday_bedtime
    inputs: {family_home: true, now: "2026-10-25 21:15:00"}  # Sun 21:15, weekday bedtime 21:00
    expect: {status: sleep, is_workday: false, next_wake: "2026-10-26 06:45:00", next_bedtime: "2026-10-26 21:00:00"}

  - name: away_morning
    inputs: {family_home: false, now: "2026-10-26 08:00:00"}
    expect: {status: away, is_workday: true, next_wake: "2026-10-27 06:45:00", next_bedtime: "2026-10-26 21:00:00"}

  - name: away_night
    inputs: {family_home: false, now: "2026-10-26 23:00:00"}
    expect: {status: away, is_workday: true, next_wake: "2026-10-27 06:45:00", next_bedtime: "2026-10-27 21:00:00"}

  - name: exactly_at_wake_awake
    inputs: {family_home: true, now: "2026-10-26 06:45:00"}  # Mon exactly wake
    expect: {status: awake, is_workday: true, next_wake: "2026-10-27 06:45:00", next_bedtime: "2026-10-26 21:00:00"}

  - name: exactly_at_bed_sleep
    inputs: {family_home: true, now: "2026-10-26 21:00:00"}  # Mon exactly bedtime
    expect: {status: sleep, is_workday: true, next_wake: "2026-10-27 06:45:00", next_bedtime: "2026-10-27 21:00:00"}

  - name: custom_schedule_boundaries
    inputs:
      family_home: true
      now: "2026-10-27 12:00:00"  # Tue
      schedule:
        wake_weekday: "05:30:00"
        wake_weekend: "09:00:00"
        bedtime_weekday: "22:30:00"
        bedtime_weekend: "23:00:00"
    expect: {status: awake, is_workday: true, next_wake: "2026-10-28 05:30:00", next_bedtime: "2026-10-27 22:30:00"}